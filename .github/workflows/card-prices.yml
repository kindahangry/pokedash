name: Fetch Card Prices

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
# last updated

jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run card price script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARDHEDGER_API_KEY: ${{ secrets.CARDHEDGER_API_KEY }}
        run: node src/scripts/card-prices.js